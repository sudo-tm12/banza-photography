# Builds the website (web/) and publishes it to GitHub Pages on every push to main.
# Served from https://sudo-tm12.github.io/banza-photography/ until BANZA's own domain is connected:
# then set BASE_PATH to '' and SITE_URL to the domain, add web/public/CNAME, and add the domain to
# ALLOWED_ORIGINS in api/wrangler.toml.
name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  BASE_PATH: /banza-photography
  SITE_URL: https://sudo-tm12.github.io/banza-photography
  API_BASE: https://banza-api.tshedzawebdev.workers.dev

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ env.BASE_PATH }}
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
          NEXT_PUBLIC_API_BASE: ${{ env.API_BASE }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
